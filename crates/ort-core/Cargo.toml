[package]
name = "ort-core"
description = "Fachkern des Open Review Tool: Event-Log, Projektionen, Übereinstimmung, Import und Austausch"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
getrandom = "0.2.15"
hex = "0.4.3"
rand = "0.8.5"
rand_chacha = "0.3.1"
regex = "1.11.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.9"
thiserror = "2.0.12"
time = "0.3.36"
uuid = { version = "1.10.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.13.0"
