name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Kern (Tests, Formatierung, Clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust-Werkzeuge
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Formatierung
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p ort-core --all-targets -- -D warnings
      - name: Tests (Event-Log, Projektionen, Referenzwerte, Import, Austausch, Ablauf)
        run: cargo test -p ort-core

  app:
    name: Mac-App (Typprüfung, Clippy, Build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Rust-Werkzeuge
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: npm-Pakete
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Typen prüfen
        working-directory: app
        run: npm run typecheck
      - name: Oberfläche bauen
        working-directory: app
        run: npm run build
      - name: Clippy
        run: cargo clippy -p open-review-tool -- -D warnings
      - name: App bauen (unsigniert)
        working-directory: app
        run: npx tauri build --bundles app
      - name: App verpacken
        run: ditto -c -k --keepParent "target/release/bundle/macos/Open Review Tool.app" open-review-tool-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: open-review-tool-macos
          path: open-review-tool-macos.zip
