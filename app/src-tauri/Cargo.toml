[package]
name = "open-review-tool"
description = "Open Review Tool: Screening für Scoping und Systematic Reviews, als native Mac-App"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
base64 = "0.22.1"
keyring = { version = "3.6.3", features = ["apple-native"] }
ort-core = { path = "../../crates/ort-core" }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tauri = { version = "2.12.7", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.8.4"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
uuid = { version = "1.10.0", features = ["serde"] }

[features]
# Entwicklungsbrücke: dieselben Befehle über HTTP auf 127.0.0.1, damit sich die Oberfläche im Browser
# gegen den echten Kern bedienen und testen lässt. Nie im Release-Build.
bridge = ["tauri/test"]
